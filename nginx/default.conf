server {

    listen 80;

    server_name _;

    client_max_body_size 25m;



    # API storefront (prefix /api)

    location /api/ {

        proxy_pass http://backend:8000/api/;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;

        proxy_connect_timeout 30s;

        proxy_send_timeout 180s;

    }



    # API admin + checkout + webhooks (sans prefix /api)

    location ~ ^/(auth|checkout|products|orders|auto-publish|dashboard|suppliers|trends|settings|listings|ai|health|webhooks)(/|$) {

        proxy_pass http://backend:8000;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline auto-publish : scraping Playwright + Ollama peut dépasser 60s

        proxy_read_timeout 180s;

        proxy_connect_timeout 30s;

        proxy_send_timeout 180s;

    }



    location /media/ {

        proxy_pass http://backend:8000/media/;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

    }



    location / {

        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

    }

}

